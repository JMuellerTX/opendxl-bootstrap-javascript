
name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
      fail-fast: false
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}   
      
    - name: Install broker
      run: |
        docker pull opendxl/opendxl-broker
        docker run -d -p 8883:8883 -p 8443:8443 -p 443:443 opendxl/opendxl-broker
        docker ps -a
        
    - name: Install dependencies
      run: |
        npm install
        # The published @opendxl/dxl-client 0.1.4 pulls mqtt 2.x and with it the ws
        # advisories, and its provisioning CLI never validated the management server.
        # --no-save leaves package.json alone.
        # The provisioning CLI in this job needs --insecure, which landed after the
        # v0.1.4+fork.1 release, so this job installs the branch rather than the tarball.
        # Switch back to the release URL once a release carries the CLI fix.
        npm install --no-save "github:JMuellerTX/opendxl-client-javascript#master"
        
    - name: Configure Client
      run: |
        ./node_modules/.bin/dxlclient provisionconfig --insecure -u admin -p password test/integration 127.0.0.1 client
        sed -i -e "s/127.0.0.1;127.0.0.1/127.0.0.1/g" -e "/local/d" -e "/docker/d" test/integration/dxlclient.config
        cat test/integration/dxlclient.config
        
    - name: Execute CI
      run: |
        npm run ci
